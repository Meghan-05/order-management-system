spring:
  application:
    name: order-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/order-management-system
    username: postgres
    password: 755869
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    root: INFO
    com.meghana: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE